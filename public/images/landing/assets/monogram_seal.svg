<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <!-- Perfectly centered concentric arcs for typography -->
    <path id="topArc" d="M 24,80 A 56,56 0 1,1 136,80" fill="none" />
    <path id="bottomArc" d="M 136,80 A 56,56 0 0,1 24,80" fill="none" />
  </defs>

  <!-- Outer Fine Ring -->
  <circle cx="80" cy="80" r="74" stroke="#9E784F" stroke-width="0.8" stroke-opacity="0.55" />
  <circle cx="80" cy="80" r="70" stroke="#9E784F" stroke-width="0.4" stroke-dasharray="1.5 2.5" stroke-opacity="0.4" />

  <!-- Four Cardinal Diamond Flourishes -->
  <!-- North -->
  <line x1="80" y1="2" x2="80" y2="8" stroke="#9E784F" stroke-width="0.75" />
  <polygon points="80,1 82.5,5 80,9 77.5,5" fill="#9E784F" opacity="0.8" />
  <!-- South -->
  <line x1="80" y1="152" x2="80" y2="158" stroke="#9E784F" stroke-width="0.75" />
  <polygon points="80,159 82.5,155 80,151 77.5,155" fill="#9E784F" opacity="0.8" />
  <!-- East -->
  <line x1="152" y1="80" x2="158" y2="80" stroke="#9E784F" stroke-width="0.75" />
  <polygon points="159,80 155,82.5 151,80 155,77.5" fill="#9E784F" opacity="0.8" />
  <!-- West -->
  <line x1="2" y1="80" x2="8" y2="80" stroke="#9E784F" stroke-width="0.75" />
  <polygon points="1,80 5,82.5 9,80 5,77.5" fill="#9E784F" opacity="0.8" />

  <!-- Circular Typography: Top Arc -->
  <text font-family="'Playfair Display', Georgia, serif" font-size="6.8" font-weight="500" letter-spacing="0.24em" fill="#7A5D3E" opacity="0.88">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      THE ROYAL RANGETHNICS
    </textPath>
  </text>

  <!-- Circular Typography: Bottom Arc -->
  <text font-family="'Playfair Display', Georgia, serif" font-size="6.4" font-weight="500" letter-spacing="0.22em" fill="#7A5D3E" opacity="0.85">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
      ROOTED IN HERITAGE
    </textPath>
  </text>

  <!-- Side Star separators -->
  <circle cx="21" cy="80" r="1.2" fill="#9E784F" opacity="0.7" />
  <circle cx="139" cy="80" r="1.2" fill="#9E784F" opacity="0.7" />

  <!-- Inner Concentric Ring -->
  <circle cx="80" cy="80" r="42" stroke="#9E784F" stroke-width="0.6" stroke-opacity="0.5" />

  <!-- Central Vertical Spire / Needle -->
  <line x1="80" y1="44" x2="80" y2="116" stroke="#9E784F" stroke-width="0.75" stroke-opacity="0.6" />
  <polygon points="80,41 81.8,45 80,49 78.2,45" fill="#9E784F" opacity="0.75" />
  <polygon points="80,119 81.8,115 80,111 78.2,115" fill="#9E784F" opacity="0.75" />

  <!-- Central Ornate Monogram R -->
  <g transform="translate(65, 55)">
    <!-- Vertical stem with serif serifs -->
    <path d="M8 8 L8 42 M2 8 L14 8 M2 42 L15 42" stroke="#5C3E22" stroke-width="1.8" stroke-linecap="square" />
    <!-- Curved bowl of R -->
    <path d="M8 9 C20 9, 26 12, 26 20 C26 28, 19 30, 8 30" fill="none" stroke="#5C3E22" stroke-width="1.8" />
    <!-- Diagonal leg of R with flared end -->
    <path d="M17 29 C20 34, 24 39, 29 42" fill="none" stroke="#5C3E22" stroke-width="1.8" stroke-linecap="round" />
    <!-- Intertwined graceful loop flourish -->
    <path d="M-2 30 C-3 22, 5 16, 14 16 C20 16, 23 19, 23 23 C23 27, 12 30, 4 32 C4 37, 10 40, 18 40 C22 40, 25 38, 27 36" fill="none" stroke="#BA8845" stroke-width="0.9" opacity="0.8" />
  </g>
</svg>